name: Patch Timeline Severity

on:
  push:
    branches:
      - fix/web-cv-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'sagadeangelo' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch timeline severity mapping
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/employx_flutter/lib/features/dashboard/views/command_center_screen.dart')
          text = path.read_text(encoding='utf-8')

          old = '''              return LiaTimelineItem(\n                text: event.title,\n                isCompleted: true,\n                stage: event.stage,\n                userMessage: event.userMessage,\n                developerMessage: event.developerMessage,\n                duration: event.duration ?? 0,\n                isError: event.severity == 'error',\n              );'''

          new = '''              final severity = event.severity.toString().trim().toLowerCase();\n              final isError = severity == 'error' || severity == 'critical';\n              final isCompleted = severity == 'info' || severity == 'success';\n\n              return LiaTimelineItem(\n                text: event.title,\n                isCompleted: isCompleted,\n                stage: event.stage,\n                userMessage: event.userMessage,\n                developerMessage: event.developerMessage,\n                duration: event.duration ?? 0,\n                isError: isError,\n              );'''

          if old not in text:
              raise SystemExit('Expected timeline mapping was not found; aborting without changes.')

          if new in text:
              raise SystemExit('Timeline severity mapping is already patched.')

          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-agent-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/employx_flutter/lib/features/dashboard/views/command_center_screen.dart .github/workflows/patch-agent-readiness.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): map timeline severity to visual state"
          git push
