name: Patch Timeline Severity

on:
  push:
    branches:
      - fix/web-cv-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'sagadeangelo' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch timeline severity mapping
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/employx_flutter/lib/features/dashboard/views/command_center_screen.dart')
          text = path.read_text(encoding='utf-8')

          old_completed = "                isCompleted: true,\n                stage: event.stage,"
          new_completed = "                isCompleted: event.severity == 'info' || event.severity == 'success',\n                stage: event.stage,"

          old_error = "                isError: event.severity == 'error',"
          new_error = "                isError: event.severity == 'error' || event.severity == 'critical',"

          start = text.index('  Widget _buildActivityTimeline(BuildContext context, dynamic snapshot) {')
          timeline = text[start:]

          if old_completed not in timeline:
              raise SystemExit('Expected timeline completion mapping was not found; aborting.')
          if old_error not in timeline:
              raise SystemExit('Expected timeline error mapping was not found; aborting.')

          timeline = timeline.replace(old_completed, new_completed, 1)
          timeline = timeline.replace(old_error, new_error, 1)
          path.write_text(text[:start] + timeline, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-agent-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/employx_flutter/lib/features/dashboard/views/command_center_screen.dart .github/workflows/patch-agent-readiness.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): map timeline severity to visual state"
          git push
