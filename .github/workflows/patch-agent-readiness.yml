name: Patch Timeline Severity

on:
  push:
    branches:
      - fix/web-cv-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'sagadeangelo' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch timeline severity mapping
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('apps/employx_flutter/lib/features/dashboard/views/command_center_screen.dart')
          text = path.read_text(encoding='utf-8')

          start = text.index('  Widget _buildActivityTimeline(BuildContext context, dynamic snapshot) {')
          block = text[start:]

          pattern = re.compile(
              r"return LiaTimelineItem\(\s*"
              r"text: event\.title,\s*"
              r"isCompleted: true,\s*"
              r"stage: event\.stage,\s*"
              r"userMessage: event\.userMessage,\s*"
              r"developerMessage: event\.developerMessage,\s*"
              r"duration: event\.duration \?\? 0,\s*"
              r"isError: event\.severity == 'error',\s*"
              r"\);",
              re.MULTILINE,
          )

          replacement = '''final severity = event.severity.toString().trim().toLowerCase();
              final isError = severity == 'error' || severity == 'critical';
              final isCompleted = severity == 'info' || severity == 'success';

              return LiaTimelineItem(
                text: event.title,
                isCompleted: isCompleted,
                stage: event.stage,
                userMessage: event.userMessage,
                developerMessage: event.developerMessage,
                duration: event.duration ?? 0,
                isError: isError,
              );'''

          patched, count = pattern.subn(replacement, block, count=1)
          if count != 1:
              raise SystemExit('Expected timeline mapping was not found; aborting without changes.')

          path.write_text(text[:start] + patched, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/patch-agent-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/employx_flutter/lib/features/dashboard/views/command_center_screen.dart .github/workflows/patch-agent-readiness.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(ui): map timeline severity to visual state"
          git push
