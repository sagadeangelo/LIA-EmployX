name: Patch Timeline Severity

on:
  push:
    branches:
      - fix/web-cv-pipeline

permissions:
  contents: write

jobs:
  patch:
    if: github.actor == 'sagadeangelo' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply timeline severity patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/employx_flutter/lib/features/dashboard/views/command_center_screen.dart')
          text = path.read_text(encoding='utf-8')
          start = text.index('  Widget _buildActivityTimeline(BuildContext context, dynamic snapshot) {')
          timeline = text[start:]

          old_completed = "                isCompleted: true,\n                stage: event.stage,"
          new_completed = "                isCompleted: event.severity == 'info' || event.severity == 'success',\n                stage: event.stage,"
          old_error = "                isError: event.severity == 'error',"
          new_error = "                isError: event.severity == 'error' || event.severity == 'critical',"

          if old_completed not in timeline or old_error not in timeline:
              raise SystemExit('Expected timeline mapping not found; aborting.')

          timeline = timeline.replace(old_completed, new_completed, 1)
          timeline = timeline.replace(old_error, new_error, 1)
          path.write_text(text[:start] + timeline, encoding='utf-8')

      - name: Commit patched file through GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FILE='apps/employx_flutter/lib/features/dashboard/views/command_center_screen.dart'
          SHA=$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" --jq '.sha')
          CONTENT=$(base64 -w0 "$FILE")
          printf '%s' "$CONTENT" | gh api \
            --method PUT \
            "repos/$REPO/contents/$FILE" \
            -f message='fix(ui): map timeline severity to visual state' \
            -f branch="$BRANCH" \
            -f sha="$SHA" \
            -f content="$CONTENT" \
            >/dev/null

      - name: Remove temporary workflow through GitHub Contents API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          FILE='.github/workflows/patch-agent-readiness.yml'
          SHA=$(gh api "repos/$REPO/contents/$FILE?ref=$BRANCH" --jq '.sha')
          gh api \
            --method DELETE \
            "repos/$REPO/contents/$FILE" \
            -f message='chore(ci): remove temporary timeline patch workflow' \
            -f branch="$BRANCH" \
            -f sha="$SHA" \
            >/dev/null
